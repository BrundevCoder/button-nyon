<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>ButtonNyon</title>
</head>
<body>

    <header>
        <div class="level-container">

            <div class="box">
                <div class="upper-part">
                    <span id="lastLevelMin">0</span>
                    <span id="nextLevelMin">10</span>
                </div>

                <div class="lower-part">
                    <div class="bar-back">
                        <div class="bar">0%</div>
                    </div>
                </div>

                <span id="levelStats">Level: 0 (normal) | 1x</span>
            </div>

        </div>
    </header>

    <main>
        
        <div class="container">
            <span class="counter">0</span>
            <button class="btn">Click</button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
